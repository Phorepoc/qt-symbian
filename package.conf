# package.conf -- how the pdk's package.yml builds this repository's SIS files (release.yml): Qt 4.8.7 and Qt Mobility 1.2
# as libraries that Qt apps depend on. They install through the Catalogue only.
NAME=qt-symbian
ARCHES="arm"
IMAGE=ghcr.io/phorepoc/web
# Qt needs nothing on top of core; core's registry has the Qt components when PHOREPOC_QT48=1
ENV="PHOREPOC_QT48=1"
REPOS_arm=""
# Qt first (the modules, then its plug-ins), then Qt Mobility, which links against it
COMPONENTS_arm="qt48_core qt48_gui qt48_network qt48_svg qt48_xml qt48_sql qt48_script qt48_declarative qt48_multimedia qt48_opengl qt48_openvg qt48_xmlpatterns qt48_phonon qt48_testlib qt48_plug_qgif qt48_plug_qtiff qt48_plug_qico qt48_plug_qjpeg qt48_plug_qmng qt48_plug_qsvg qt48_plug_qcncodecs qt48_plug_qjpcodecs qt48_plug_qkrcodecs qt48_plug_qtwcodecs qt48_plug_qsvgicon qt48_plug_qsymbianbearer qt48_plug_phonon_mmf qt48_plug_qvggraphicssystem qt48_plug_qglgraphicssystem qt48_plug_qmlfolderlistmodelplugin qt48_plug_qmlgesturesplugin qt48_plug_qmlparticlesplugin qt48_plug_qmlshadersplugin qt48_multimediakit qtmessaging qtsensors qtbearer qtserviceframework qtpublishsubscribe qtsysteminfo qtlocation qtcontacts qtversit qtorganizer qtversitorganizer qtfeedback qtgallery qtsensors_generic qtfeedback_mmk qtfeedback_symbian qtgeoservices_nokia qtorganizer_symbian qtcontacts_serviceactionmanager qtversit_backuphandler qtversit_vcardpreserver qtsensors_sym qtcontacts_symbian qtlandmarks_symbian qtmultimediakit_ecamengine qtmultimediakit_mmfengine qtmultimediakit_m3u declarative_multimedia declarative_messaging declarative_sensors declarative_systeminfo declarative_publishsubscribe declarative_serviceframework declarative_location declarative_contacts declarative_organizer declarative_feedback declarative_gallery"
