# package.conf -- how the pdk's package.yml builds this repository's SIS files (release.yml): Qt 4.8.7, the libraries that Qt
# apps depend on. It installs through the Catalogue only. (Qt Mobility 1.2 is not released yet: some of its components link
# platform libraries that are not built yet -- lbt, hwrmhapticsclient, the landmarks search libraries ... -- and would ship
# with stubbed imports.)
NAME=qt-symbian
ARCHES="arm"
IMAGE=ghcr.io/phorepoc/web
# Qt needs nothing on top of core; core's registry has the Qt components when PHOREPOC_QT48=1
ENV="PHOREPOC_QT48=1"
REPOS_arm=""
# the modules, then the plug-ins
COMPONENTS_arm="qt48_core qt48_gui qt48_network qt48_svg qt48_xml qt48_sql qt48_script qt48_declarative qt48_multimedia qt48_opengl qt48_openvg qt48_xmlpatterns qt48_phonon qt48_testlib qt48_plug_qgif qt48_plug_qtiff qt48_plug_qico qt48_plug_qjpeg qt48_plug_qmng qt48_plug_qsvg qt48_plug_qcncodecs qt48_plug_qjpcodecs qt48_plug_qkrcodecs qt48_plug_qtwcodecs qt48_plug_qsvgicon qt48_plug_qsymbianbearer qt48_plug_phonon_mmf qt48_plug_qvggraphicssystem qt48_plug_qglgraphicssystem qt48_plug_qmlfolderlistmodelplugin qt48_plug_qmlgesturesplugin qt48_plug_qmlparticlesplugin qt48_plug_qmlshadersplugin"
